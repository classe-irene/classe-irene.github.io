<!doctype html>
<html lang="it">
<head>
<title>La palestra delle equivalenze · La classe di Irene</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<script src="assets/curricolo.js"></script>
<script src="assets/emoji-elenco.js"></script>
<script src="assets/comune.js"></script>
<script src="assets/animazioni.js"></script>
<script src="assets/giochi.js"></script>
<script src="assets/motore.js"></script>
<script src="assets/palestra.js"></script>
</head>
<body class="palestra">
<main class="contenitore" id="radice">
  <div class="intest-sezione palestra-testa" data-numero="⚖️">
    <span class="etichetta">🔢 Matematica · classe 4ª</span>
    <h1>La palestra delle equivalenze</h1>
    <p>Solo equivalenze, una alla volta. Scegli il livello e allenati!</p>
  </div>
  <div class="palestra-livelli" id="livelli">
    <button class="livello" data-livello="1" data-figura="🍫"><b>Livello 1</b><span>k · h · da · u</span><small>Aggiungo o tolgo gli zeri</small></button>
    <button class="livello" data-livello="2" data-figura="🗂️"><b>Livello 2</b><span>hk · dak · uk · h · da · u</span><small>Leggo fino alla casella</small></button>
    <button class="livello" data-livello="misto" data-figura="🎲"><b>Misto</b><span>Livello 1 e 2</span><small>Per i campioni</small></button>
  </div>
  <div class="palestra-comandi" id="comandi" hidden>
    <button class="btn" data-azione="lim">🖥️ Modalità LIM</button>
    <button class="btn bianco" data-azione="velocita">🐢 Voce</button>
    <button class="btn bianco" data-azione="suoni">🔔 Suoni: sì</button>
    <button class="btn bianco" data-azione="maiuscolo">🔠 STAMPATO MAIUSCOLO</button>
  </div>
  <div class="punteggio" id="punteggio" hidden>⭐ <span data-punti>0</span> / 10</div>
  <div class="palestra-pallini" id="pallini"></div>
  <div id="palestra-esercizi"></div>
  <div class="fine" id="fine" hidden></div>
</main>
<script>
  creaTestata("matematica");
  const radice = document.getElementById("radice");
  const box = document.getElementById("palestra-esercizi"), fine = document.getElementById("fine"), pallini = document.getElementById("pallini");
  const NOMI = { 1: "Livello 1", 2: "Livello 2", misto: "Misto" };
  const FIG = { 1: "🍫", 2: "🗂️", misto: "🎲" };
  // Le figure dei pulsanti dei livelli.
  document.querySelectorAll(".livello").forEach((b) => b.insertAdjacentHTML("afterbegin", Figura.img(b.dataset.figura, "figura grande")));

  let esercizi = [], i = 0, risolti = 0, errori = 0, livello = null;
  const barra = document.createElement("div");
  barra.className = "lim-barra"; barra.hidden = true;
  barra.innerHTML = `<button class="lim-freccia" data-vai="prec" aria-label="Indietro">◀</button>
    <span class="lim-conta"></span>
    <button class="lim-freccia" data-vai="succ" aria-label="Avanti">▶</button>
    <button class="lim-esci" data-vai="esci" hidden>✕ Esci</button>`;
  document.body.append(barra);
  const succ = barra.querySelector('[data-vai="succ"]');

  function comincia(l) {
    livello = l; esercizi = Palestra.giro(l); i = 0; risolti = 0; errori = 0;
    history.replaceState(null, "", `?livello=${l}`);
    document.querySelectorAll(".livello").forEach((b) => b.classList.toggle("scelto", b.dataset.livello === String(l)));
    document.getElementById("comandi").hidden = false;
    document.getElementById("punteggio").hidden = false;
    radice.querySelector("[data-punti]").textContent = 0;
    fine.hidden = true; fine.innerHTML = ""; box.innerHTML = "";
    pallini.innerHTML = esercizi.map((_, k) => `<span class="pallino" data-p="${k}">${k + 1}</span>`).join("");
    esercizi.forEach((e, k) => {
      const el = document.createElement("div");
      el.className = "esercizio";
      el.innerHTML = `<span class="num">Esercizio ${k + 1} di ${esercizi.length}</span><div class="corpo"></div><div class="spiegazione"></div>`;
      box.append(el);
      const sp = el.querySelector(".spiegazione");
      Motore.esercizio(e, el.querySelector(".corpo"), {
        ok() {
          if (el.classList.contains("risolto")) return;
          el.classList.add("risolto"); risolti++;
          radice.querySelector("[data-punti]").textContent = risolti;
          pallini.querySelector(`[data-p="${k}"]`).classList.add("fatto");
          Suono.giusto();
          sp.textContent = caso(Motore.BRAVO) + (e.spiegazione ? " " + e.spiegazione : ""); sp.classList.add("visibile");
          mostra(i);
          if (risolti === esercizi.length) setTimeout(finale, 1400);
        },
        ko(nodo) {
          errori++; Suono.sbagliato();
          if (nodo) { nodo.classList.remove("sbagliata"); void nodo.offsetWidth; nodo.classList.add("sbagliata"); }
          sp.textContent = caso(Motore.RIPROVA) + (e.suggerimento ? " " + e.suggerimento : ""); sp.classList.add("visibile");
        },
        bene(nodo) {
          nodo?.classList.remove("sbagliata");
          if (sp.classList.contains("visibile")) sp.textContent = caso(["Giusto! 👍", "Bravo! Continua così.", "Sì, è quello giusto!"]);
        },
      });
    });
    barra.hidden = false;
    mostra(0);
    if (!document.body.classList.contains("lim")) box.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  const caso = (a) => a[Math.floor(Math.random() * a.length)];

  // Un esercizio alla volta: si va avanti quando è risolto.
  function mostra(n) {
    const pp = [...box.children];
    const finito = !fine.hidden;
    i = Math.max(0, Math.min(pp.length - 1, n));
    pp.forEach((p, k) => p.classList.toggle("corrente", k === i && !finito));
    fine.classList.toggle("corrente", finito);
    pallini.querySelectorAll(".pallino").forEach((p, k) => p.classList.toggle("ora", k === i && !finito));
    barra.querySelector(".lim-conta").textContent = finito ? "🏁" : `${i + 1} / ${pp.length}`;
    barra.querySelector('[data-vai="prec"]').disabled = i === 0 && !finito;
    const fatto = pp[i]?.classList.contains("risolto");
    succ.disabled = finito || !fatto;
    succ.classList.toggle("pulsa", !!fatto && !finito);
  }
  function finale() {
    const n = esercizi.length, stelle = errori <= n * 0.2 ? 3 : errori <= n * 0.6 ? 2 : 1;
    Album.aggiungi({ titolo: `Palestra delle equivalenze · ${NOMI[livello]}`, file: `equivalenze.html?livello=${livello}`, premio: FIG[livello], materia: "matematica", classe: 4, data: new Date().toISOString().slice(0, 10) });
    fine.innerHTML = `<div class="stelle">${"⭐".repeat(stelle)}${"☆".repeat(3 - stelle)}</div>
      <div class="figurina-vinta">${Figura.img(FIG[livello], "figura gigante")}<p>Hai vinto la figurina del ${NOMI[livello]} per il tuo <a href="album.html">album</a>!</p></div>
      <h2>Allenamento finito!</h2>
      <p>${stelle === 3 ? "Sei un campione delle equivalenze!" : stelle === 2 ? "Ottimo lavoro, continua così!" : "Ce l'hai fatta! Con un po' di allenamento andrà ancora meglio."}</p>
      <div class="azioni-fine"><button class="btn" data-ancora>🔁 Altri 10 esercizi</button>
      ${livello !== "2" ? `<button class="btn verde" data-livello-fine="${livello === "1" ? "2" : "misto"}">⬆️ Prova il ${livello === "1" ? "Livello 2" : "Misto"}</button>` : `<button class="btn verde" data-livello-fine="misto">🎲 Prova il Misto</button>`}</div>`;
    fine.hidden = false;
    Suono.festa(); coriandoli();
    mostra(i);
    if (!document.body.classList.contains("lim")) fine.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  // LIM: schermo intero, tasti grandi, frecce della tastiera e telecomando.
  function lim(on) {
    document.body.classList.toggle("lim", on);
    barra.querySelector('[data-vai="esci"]').hidden = !on;
    if (on) document.documentElement.requestFullscreen?.().catch(() => {});
    else if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    mostra(i); scrollTo(0, 0);
  }
  barra.addEventListener("click", (ev) => {
    const a = ev.target.closest("button")?.dataset.vai;
    if (a === "prec") { if (!fine.hidden) { fine.hidden = true; mostra(esercizi.length - 1); } else mostra(i - 1); }
    if (a === "succ") mostra(i + 1);
    if (a === "esci") lim(false);
  });
  document.addEventListener("keydown", (ev) => {
    if (barra.hidden) return;
    if (["ArrowRight", "PageDown"].includes(ev.key) && !succ.disabled) { ev.preventDefault(); mostra(i + 1); }
    if (["ArrowLeft", "PageUp"].includes(ev.key)) { ev.preventDefault(); mostra(i - 1); }
  });
  radice.addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.livello) comincia(b.dataset.livello);
    if (b.dataset.livelloFine) comincia(b.dataset.livelloFine);
    if (b.hasAttribute("data-ancora")) comincia(livello);
    if (b.dataset.leggi) Voce.parla(b.dataset.leggi, null, { scritte: false });
    const a = b.dataset.azione;
    if (a === "lim") lim(true);
    if (a === "velocita") {
      const nomi = Object.keys(Voce.VELOCITA), dopo = nomi[(nomi.indexOf(Voce.velocita()) + 1) % nomi.length];
      Voce.impostaVelocita(dopo); b.textContent = `🐢 Voce: ${dopo}`; Voce.parla("Leggo così.", null, { scritte: false });
    }
    if (a === "suoni") { Suono.attivo = !Suono.attivo; b.textContent = `🔔 Suoni: ${Suono.attivo ? "sì" : "no"}`; }
    if (a === "maiuscolo") document.body.classList.toggle("maiuscolo");
  });
  document.querySelector('[data-azione="velocita"]').textContent = `🐢 Voce: ${Voce.velocita()}`;
  const l0 = parametri().livello;
  if (["1", "2", "misto"].includes(l0)) comincia(l0);
</script>
</body>
</html>
