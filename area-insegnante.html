const CHIAVE = "classe-irene-chiave";
const da64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function apri(chiave) {
  const testo = await crypto.subtle.decrypt({ name: "AES-GCM", iv: da64(DATI.iv) }, chiave, da64(DATI.c));
  document.open(); document.write(new TextDecoder().decode(testo)); document.close();
}
async function daPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: da64(DATI.s), iterations: DATI.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
const ricordata = (() => { try { return localStorage.getItem(CHIAVE) || sessionStorage.getItem(CHIAVE); } catch { return null; } })();
if (ricordata) crypto.subtle.importKey("raw", da64(ricordata), "AES-GCM", true, ["decrypt"]).then(apri).catch(() => {});
creaTestata("cinque");
document.getElementById("accesso").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById("msg"), btn = document.getElementById("entra");
  btn.disabled = true; msg.innerHTML = '<p class="nota">Controllo…</p>';
  try {
    const chiave = await daPassword(document.getElementById("pw").value);
    const grezza = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", chiave))));
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: da64(DATI.iv) }, chiave, da64(DATI.c));
    try { (document.getElementById("ricorda").checked ? localStorage : sessionStorage).setItem(CHIAVE, grezza); } catch {}
    await apri(chiave);
  } catch {
    btn.disabled = false;
    msg.innerHTML = '<div class="avviso errore">Password sbagliata. Controlla maiuscole e trattini e riprova.</div>';
  }
});
