<!doctype html>
<html lang="it">
<head>
<title>Album delle figurine · La classe di Irene</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<script src="assets/curricolo.js"></script>
<script src="assets/emoji-elenco.js"></script>
<script src="assets/comune.js"></script>
<script src="assets/giochi.js"></script>
<script src="assets/motore.js"></script>
</head>
<body>
<main class="contenitore">
  <div class="lezione-testa">
    <span class="emoji">🏆</span>
    <h1>L'album delle figurine</h1>
    <p>Ogni lezione finita regala una figurina. Quante ne avete raccolte?</p>
  </div>
  <div id="album" class="album"></div>
</main>
<script>
  creaTestata();
  const vinte = Album.tutte();
  // Le caselle vuote sono le lezioni pronte non ancora finite.
  const pronte = Object.entries(CURRICOLO).flatMap(([m, classi]) => Object.entries(classi).flatMap(([c, arg]) => arg.filter((a) => a.lezione).map((a) => ({ m, c: +c, titolo: a.titolo, lezione: a.lezione }))));
  const fatte = new Set(vinte.map((v) => v.file));
  document.getElementById("album").innerHTML =
    vinte.map((v) => `<div class="figurina">${Figura.img(v.premio || "🏆", "figura grande")}<b>${escapeHTML(v.titolo)}</b><span class="nota">${v.classe ? escapeHTML(v.classe) + "ª · " : ""}${escapeHTML(v.data || "")}</span></div>`).join("")
    + pronte.filter((p) => !fatte.has(p.lezione)).map((p) => `<a class="figurina vuota" href="lezione.html?file=${encodeURIComponent(p.lezione)}"><span class="punto-domanda">?</span><b>${escapeHTML(p.titolo)}</b><span class="nota">${MATERIE[p.m].icona} ${p.c}ª · da vincere</span></a>`).join("");
</script>
</body>
</html>
