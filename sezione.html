<!doctype html>
<html lang="it">
<head>
<title>Sezione · La classe di Irene</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<script src="assets/curricolo.js"></script>
<script src="assets/emoji-elenco.js"></script>
<script src="assets/comune.js"></script>
</head>
<body>
<main class="contenitore" id="radice"></main>
<script>
  const { materia = "matematica", classe = "1" } = parametri();
  const m = MATERIE[materia] || MATERIE.matematica;
  const c = Math.min(5, Math.max(1, parseInt(classe) || 1));
  creaTestata(materia);
  document.body.classList.toggle("scienze", materia === "scienze");
  document.title = `${m.nome} classe ${c}ª · ${SITO.nome}`;

  const argomenti = (CURRICOLO[materia] || {})[c] || [];
  const mie = Archivio.tutte().filter((l) => l.materia === materia && +l.classe === c);

  const scheda = (a) => a.lezione
    ? `<a class="argomento pronta${a.evidenza ? " in-evidenza" : ""}" href="lezione.html?file=${encodeURIComponent(a.lezione)}">${a.evidenza ? '<span class="nastro-evidenza">⭐ In evidenza</span>' : ""}${Figura.img(a.emoji, a.evidenza ? "figura grande" : "figura media")}<h3>${escapeHTML(a.titolo)}</h3><p>${escapeHTML(a.descrizione)}</p><span class="stato">▶ Lezione pronta</span></a>`
    : `<div class="argomento">${Figura.img(a.emoji, "figura media")}<h3>${escapeHTML(a.titolo)}</h3><p>${escapeHTML(a.descrizione)}</p>
        <div class="azioni"><a class="btn piccolo bianco" href="area-insegnante.html?materia=${materia}&classe=${c}&argomento=${encodeURIComponent(a.titolo)}">🔒 Crea in 5 minuti</a></div></div>`;

  document.getElementById("radice").innerHTML = `
    <div class="intest-sezione" data-numero="${c}ª">
      <span class="etichetta">${m.icona} ${m.nome}</span>
      <h1>Classe ${c}ª</h1>
      <p>Riferimento: ${RIFERIMENTO(c)}</p>
      <p style="margin-top:12px;display:flex;flex-wrap:wrap;gap:10px">
        ${materia === "matematica" && c >= 4 ? `<a class="btn piccolo giallo" href="equivalenze.html">⚖️ Palestra delle equivalenze</a>` : ""}
        ${materia === "matematica" && (c === 2 || c === 5) ? `<a class="btn piccolo giallo" href="invalsi.html">📝 Prove in stile INVALSI</a>` : ""}
        <a class="btn piccolo bianco" href="area-insegnante.html?scheda=verifica&materia=${materia}&classe=${c}">🔒 📝 Crea una verifica</a></p>
    </div>
    ${mie.length ? `<h2>⭐ Le mie lezioni</h2><div class="argomenti">${mie.map((l) => `
      <div class="argomento pronta">${Figura.img(l.emoji || "✨", "figura media")}<h3>${escapeHTML(l.titolo)}</h3><p>${escapeHTML(l.introduzione || "")}</p>
      <div class="azioni"><a class="btn piccolo" href="lezione.html?locale=${encodeURIComponent(l.id)}">▶ Apri</a>
      <button class="btn piccolo bianco" data-elimina="${escapeHTML(l.id)}">🗑️</button></div></div>`).join("")}</div>` : ""}
    <h2>📚 Argomenti dell'anno</h2>
    <div class="argomenti">${argomenti.map(scheda).join("")}</div>`;

  document.addEventListener("click", (e) => {
    const id = e.target.closest("[data-elimina]")?.dataset.elimina;
    if (id && confirm("Eliminare questa lezione?")) { Archivio.elimina(id); location.reload(); }
  });
</script>
</body>
</html>
